name: Test

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore: ['**.md']

concurrency:
  group: test-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: |
          curl -sSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      # The build system takes a file or folder whose time or inode has changed as edited, and checkout gives each a new
      # inode and the current time. Each file and folder gets a time drawn from its content instead (a folder's from its
      # tree's hash), the same from run to run until something in it changes.
      - name: Prepare the build cache
        id: xcode
        run: |
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          git ls-files -s | perl -ne '/^\S+ (\S+) \S+\t(.*)$/ and utime 1e9 + hex(substr($1, 0, 7)), 1e9 + hex(substr($1, 0, 7)), $2'
          git ls-tree -r -d HEAD | perl -ne '/^\S+ \S+ (\S+)\t(.*)$/ and utime 1e9 + hex(substr($1, 0, 7)), 1e9 + hex(substr($1, 0, 7)), $2'
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            build/store
            !build/store/Index.noindex
            !build/store/Logs
          key: store-${{ steps.xcode.outputs.build }}-${{ hashFiles('project.yml', 'Sources/**', 'UnstirTests/**', 'StoreKit/**', 'Config/**', '.github/workflows/test.yml', '.github/workflows/nightly.yml', 'scripts/test-store.sh') }}
          restore-keys: store-${{ steps.xcode.outputs.build }}-
      # Signed ad hoc by the script, as the nightly needs. The timing summary says where the build's tasks spent their
      # time; xcodebuild's phase and task lines pass too, so the log's timestamps show when each began. grep holds
      # piped lines back in blocks, which stamps a few minutes' lines with one time, unless it flushes each.
      # `shell: bash` adds pipefail; without it the step's status is grep's, which passes once any test has run.
      - name: Build for testing
        shell: bash
        run: |
          scripts/test-store.sh build-for-testing -showBuildTimingSummary COMPILER_INDEX_STORE_ENABLE=NO | tee "$RUNNER_TEMP/build.log" | grep --line-buffered -E "^([A-Za-z*]|.*(error|warning):)"
      # The simulator boots once the build is done. Booting beside it can stall the build (one build description took
      # 164 s, against 3 to 5 s without it) for far more than the 20 s of a cache hit's build it could hide. The id goes
      # to the test step in a file, empty if none is found, so that step fails.
      - name: Boot the simulator
        run: |
          udid=$(xcrun simctl list devices available | grep 'iPhone' | grep 'Pro Max (' | head -1 | grep -oE '[0-9A-F-]{36}' || true)
          echo "$udid" > "$RUNNER_TEMP/udid"
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b > /dev/null
      # The first launch after a boot has taken the simulator 218 s against 2 s (2026-11-13, in xcodebuild's own
      # launch of the test host, with nothing logged), so the app is launched once here, where each part is timed
      # and the host's load printed either side: a stall then has a step and a busiest process to its name.
      - name: Warm the simulator
        shell: bash
        run: |
          udid=$(cat "$RUNNER_TEMP/udid")
          app=build/store/Build/Products/Debug-iphonesimulator/Unstir.app
          load() { uptime; ps -Aro %cpu,etime,comm | head -8; }
          load
          SECONDS=0; xcrun simctl install "$udid" "$app"; echo "install ${SECONDS} s"
          SECONDS=0; xcrun simctl launch "$udid" com.screendead.Unstir; echo "launch ${SECONDS} s"
          load
          xcrun simctl terminate "$udid" com.screendead.Unstir || true
      # The StoreKit tests and First Stir's suite (out of v1; its vignette render alone takes two minutes) run nightly
      # on master (nightly.yml).
      - name: Test
        shell: bash
        run: |
          udid=$(cat "$RUNNER_TEMP/udid")
          [[ -n "$udid" ]] || { echo "no Pro Max simulator" >&2; exit 1; }
          UNSTIR_SIM=$udid scripts/test-store.sh test-without-building -skip-testing:UnstirTests/StoreTests -skip-testing:UnstirTests/FirstStirTests -skip-testing:UnstirTests/SolverTests/testFirstStirParIsTheOptimum -skip-testing:UnstirTests/PackTests/testFirstStirPlaysInOrderFromTheShelf -resultBundlePath "$RUNNER_TEMP/Test.xcresult" | tee "$RUNNER_TEMP/test.log" | grep --line-buffered -E "^(Test Suite .* (passed|failed)|Test Case .* failed|\*\* TEST|error:)|: error: |xcodebuild\[|Testing|Restarting|never began|Selected tests' started"
      # The whole test log and the result bundle, whose action log times the install, the launch and the connection to
      # the test runner: a test start that stalls 200 to 370 s (3 of 20 runs, 2026-11-11) shows nothing in the filtered
      # log above.
      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-log
          path: |
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/Test.xcresult
            ~/Library/Logs/CoreSimulator
          retention-days: 14
          if-no-files-found: ignore
      # Measures the app the build step made, so it costs no build of its own.
      - name: App size
        run: scripts/app-size.sh build/store/Build/Products/Debug-iphonesimulator/Unstir.app
      - name: Slowest tests
        if: always()
        run: scripts/ci-times.sh "$RUNNER_TEMP/test.log"
