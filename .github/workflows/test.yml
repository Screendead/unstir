name: Test

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore: ['**.md']

concurrency:
  group: test-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Look at the simulators
        run: |
          sysctl -n hw.ncpu hw.memsize
          xcrun simctl list runtimes
          xcrun simctl runtime list -v || true
          xcrun simctl list devices booted
          xcrun simctl list devices available | grep iPhone
          sw_vers
          ls -la /Library/Developer/CoreSimulator/Caches/dyld/*/ ~/Library/Developer/CoreSimulator/Caches/dyld/*/ 2>&1 || true
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: |
          curl -sSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      # The build system takes a file whose time or inode has changed as edited, and checkout gives every file a new
      # inode and the current time. Each file gets a time drawn from its content instead, the same from run to run
      # until the file changes.
      - name: Prepare the build cache
        id: xcode
        run: |
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          git ls-files -s | perl -ne '/^\S+ (\S+) \S+\t(.*)$/ and utime 1e9 + hex(substr($1, 0, 7)), 1e9 + hex(substr($1, 0, 7)), $2'
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            build/store
            !build/store/Index.noindex
            !build/store/Logs
          key: store-${{ steps.xcode.outputs.build }}-${{ hashFiles('project.yml', 'Sources/**', 'UnstirTests/**', 'StoreKit/**', '.github/workflows/test.yml', 'scripts/test-store.sh') }}
          restore-keys: store-${{ steps.xcode.outputs.build }}-
      # Signed ad hoc by the script, so the StoreKit tests run too.
      - name: Test
        run: |
          udid=$(xcrun simctl list devices available | grep 'iPhone' | grep 'Pro Max (' | tail -1 | grep -oE '[0-9A-F-]{36}')
          set -o pipefail
          echo "udid=$udid"
          (
            set +e +o pipefail
            while :; do
              state=$(xcrun simctl list devices | grep "$udid" | grep -oE 'Booting|Booted|Shutdown|Shutting Down' || true)
              app=no; xcrun simctl get_app_container "$udid" com.screendead.Unstir >/dev/null 2>&1 && app=yes
              run=$(pgrep -f 'Unstir.app/Unstir' | wc -l | tr -d ' ')
              echo "MON $(date -u +%T) state=$state app=$app run=$run load=$(sysctl -n vm.loadavg)"
              ps -Ao pcpu=,comm= | sort -rn | head -4 | awk '{ n = split($2, a, "/"); printf "MON   %s %s\n", $1, a[n] }'
              sleep 5
            done
          ) &
          mon=$!
          (xcrun simctl bootstatus "$udid" 2>&1 | while IFS= read -r l; do echo "BOOT $(date -u +%T) $l"; done) &
          UNSTIR_SIM=$udid scripts/test-store.sh COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | grep -vE '^(    |CompileSwift|SwiftCompile|SwiftDriver|Ld |CpResource|ProcessInfoPlist|CodeSign|Touch|RegisterExecutionPolicy|Validate|ExtractAppIntents|GenerateDSYM|WriteAuxiliaryFile|SwiftEmit|SwiftMerge|Copy |CopySwiftLibs|ProcessProductPackaging|MkDir|CreateBuildDirectory|Signing |Building library|note: Building|note: Run script)'
          kill "$mon" || true
