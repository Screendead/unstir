name: Test

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore: ['**.md']

concurrency:
  group: test-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: |
          curl -sSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      # The build system takes a file whose time or inode has changed as edited, and checkout gives every file a new
      # inode and the current time. Each file gets a time drawn from its content instead, the same from run to run
      # until the file changes.
      - name: Prepare the build cache
        id: xcode
        run: |
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          git ls-files -s | perl -ne '/^\S+ (\S+) \S+\t(.*)$/ and utime 1e9 + hex(substr($1, 0, 7)), 1e9 + hex(substr($1, 0, 7)), $2'
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            build/store
            !build/store/Index.noindex
            !build/store/Logs
          key: store-${{ steps.xcode.outputs.build }}-${{ hashFiles('project.yml', 'Sources/**', 'UnstirTests/**', 'StoreKit/**', 'Config/**', '.github/workflows/test.yml', '.github/workflows/nightly.yml', 'scripts/test-store.sh') }}
          restore-keys: store-${{ steps.xcode.outputs.build }}-
      # The simulator boots while the build runs, so the test step waits only for what is left of the boot. Signed ad hoc
      # by the script, as the nightly needs. The timing summary says where the build's time went.
      # `shell: bash` adds pipefail; without it the step's status is grep's, which passes once any test has run.
      - name: Build for testing
        id: build
        shell: bash
        run: |
          udid=$(xcrun simctl list devices available | grep 'iPhone' | grep 'Pro Max (' | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" &
          UNSTIR_SIM=$udid scripts/test-store.sh build-for-testing -showBuildTimingSummary COMPILER_INDEX_STORE_ENABLE=NO | tee "$RUNNER_TEMP/build.log" | grep -E "^(error:|\*\* TEST BUILD|[A-Za-z]+ \([0-9]+ tasks?\) \| )"
      # The StoreKit tests and First Stir's suite (out of v1; its vignette render alone takes two minutes) run nightly
      # on master (nightly.yml).
      - name: Test
        shell: bash
        env:
          udid: ${{ steps.build.outputs.udid }}
        run: |
          SECONDS=0
          xcrun simctl bootstatus "$udid" -b > /dev/null
          echo "waited ${SECONDS} s for the simulator to boot"
          UNSTIR_SIM=$udid scripts/test-store.sh test-without-building -skip-testing:UnstirTests/StoreTests -skip-testing:UnstirTests/FirstStirTests | tee "$RUNNER_TEMP/test.log" | grep -E "^(Test Suite .* (passed|failed)|Test Case .* failed|\*\* TEST|error:)"
      # Measures the app the build step made, so it costs no build of its own.
      - name: App size
        run: scripts/app-size.sh build/store/Build/Products/Debug-iphonesimulator/Unstir.app
      - name: Slowest tests
        if: always()
        run: scripts/ci-times.sh "$RUNNER_TEMP/test.log"
