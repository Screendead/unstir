name: Test

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore: ['**.md']

concurrency:
  group: test-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: |
          curl -sSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      # The build system takes a file or folder whose time or inode has changed as edited, and checkout gives each a new
      # inode and the current time. Each file and folder gets a time drawn from its content instead (a folder's from its
      # tree's hash), the same from run to run until something in it changes.
      - name: Prepare the build cache
        id: xcode
        run: |
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          git ls-files -s | perl -ne '/^\S+ (\S+) \S+\t(.*)$/ and utime 1e9 + hex(substr($1, 0, 7)), 1e9 + hex(substr($1, 0, 7)), $2'
          git ls-tree -r -d HEAD | perl -ne '/^\S+ \S+ (\S+)\t(.*)$/ and utime 1e9 + hex(substr($1, 0, 7)), 1e9 + hex(substr($1, 0, 7)), $2'
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            build/store
            !build/store/Index.noindex
            !build/store/Logs
          key: store-${{ steps.xcode.outputs.build }}-${{ hashFiles('project.yml', 'Sources/**', 'UnstirTests/**', 'StoreKit/**', 'Config/**', '.github/workflows/test.yml', '.github/workflows/nightly.yml', 'scripts/test-store.sh') }}
          restore-keys: store-${{ steps.xcode.outputs.build }}-
      # The simulator boots in the background while the build runs, and the test step waits for what is left. It starts
      # after the cache is restored, since the boot's disk traffic slowed the restore's untar from about 3 s to 124 s.
      # Reading the device list took 5 to 70 s, so the lookup runs in the background too and hands the id on in a file,
      # empty if none is found, so the test step fails rather than waiting.
      - name: Boot the simulator
        run: |
          (
            SECONDS=0
            udid=$(xcrun simctl list devices available | grep 'iPhone' | grep 'Pro Max (' | head -1 | grep -oE '[0-9A-F-]{36}' || true)
            echo "$udid" > "$RUNNER_TEMP/udid.part" && mv "$RUNNER_TEMP/udid.part" "$RUNNER_TEMP/udid"
            xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b > /dev/null; echo "$SECONDS" > "$RUNNER_TEMP/boot.s"
          ) > /dev/null 2>&1 &
      # Signed ad hoc by the script, as the nightly needs. The timing summary says where the build's time went.
      # `shell: bash` adds pipefail; without it the step's status is grep's, which passes once any test has run.
      - name: Build for testing
        shell: bash
        run: |
          scripts/test-store.sh build-for-testing -showBuildTimingSummary COMPILER_INDEX_STORE_ENABLE=NO | tee "$RUNNER_TEMP/build.log" | grep -E "^(error:|\*\* TEST BUILD|[A-Za-z]+ \([0-9]+ tasks?\) \| )"
      # The StoreKit tests and First Stir's suite (out of v1; its vignette render alone takes two minutes) run nightly
      # on master (nightly.yml).
      - name: Test
        shell: bash
        run: |
          SECONDS=0
          until [[ -s "$RUNNER_TEMP/udid" ]]; do sleep 1; done
          udid=$(cat "$RUNNER_TEMP/udid")
          xcrun simctl bootstatus "$udid" -b > /dev/null
          echo "waited ${SECONDS} s for the simulator, which took $(cat "$RUNNER_TEMP/boot.s" 2> /dev/null || echo "?") s to boot"
          UNSTIR_SIM=$udid scripts/test-store.sh test-without-building -skip-testing:UnstirTests/StoreTests -skip-testing:UnstirTests/FirstStirTests -skip-testing:UnstirTests/SolverTests/testFirstStirParIsTheOptimum -skip-testing:UnstirTests/PackTests/testFirstStirPlaysInOrderFromTheShelf | tee "$RUNNER_TEMP/test.log" | grep -E "^(Test Suite .* (passed|failed)|Test Case .* failed|\*\* TEST|error:)"
      # Measures the app the build step made, so it costs no build of its own.
      - name: App size
        run: scripts/app-size.sh build/store/Build/Products/Debug-iphonesimulator/Unstir.app
      - name: Slowest tests
        if: always()
        run: scripts/ci-times.sh "$RUNNER_TEMP/test.log"
