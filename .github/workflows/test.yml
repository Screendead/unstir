name: Test

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore: ['**.md']

concurrency:
  group: test-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: |
          curl -sSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      # The build system takes a file whose time or inode has changed as edited, and checkout gives every file a new
      # inode and the current time. Each file gets a time drawn from its content instead, the same from run to run
      # until the file changes.
      - name: Prepare the build cache
        id: xcode
        run: |
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          git ls-files -s | perl -ne '/^\S+ (\S+) \S+\t(.*)$/ and utime 1e9 + hex(substr($1, 0, 7)), 1e9 + hex(substr($1, 0, 7)), $2'
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            build/store
            !build/store/Index.noindex
            !build/store/Logs
          key: store-${{ steps.xcode.outputs.build }}-${{ hashFiles('project.yml', 'Sources/**', 'UnstirTests/**', 'StoreKit/**', 'Config/**', '.github/workflows/test.yml', 'scripts/test-store.sh') }}
          restore-keys: store-${{ steps.xcode.outputs.build }}-
      # Signed ad hoc by the script, so the StoreKit tests run too.
      - name: Test
        run: |
          udid=$(xcrun simctl list devices available | grep 'iPhone' | grep 'Pro Max (' | head -1 | grep -oE '[0-9A-F-]{36}')
          UNSTIR_SIM=$udid scripts/test-store.sh COMPILER_INDEX_STORE_ENABLE=NO | tee "$RUNNER_TEMP/test.log" | grep -E "^(Test Suite .* (passed|failed)|Test Case .* failed|\*\* TEST|error:)"
      - name: Slowest tests
        if: always()
        run: |
          echo "== suites =="
          grep -E "^Test Suite '[A-Za-z]+' (passed|failed)" "$RUNNER_TEMP/test.log" | sed -E "s/.*'([A-Za-z]+)'.*Executed ([0-9]+) tests?.* in ([0-9.]+) \(.*/\3 \1 (\2 tests)/" | sort -rn
          echo "== slowest 30 cases =="
          grep -E "^Test Case .* (passed|failed) \(" "$RUNNER_TEMP/test.log" | sed -E "s/.*\[(.*)\]'.*\(([0-9.]+) seconds\).*/\2 \1/" | sort -rn | head -30
