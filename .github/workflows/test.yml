name: Test

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore: ['**.md']

concurrency:
  group: test-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Boots alongside the build; "Wait for the simulator" blocks until it is up.
      - name: Boot simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available | grep 'iPhone' | grep 'Pro Max (' | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
      - name: Install XcodeGen
        run: |
          curl -sSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      # The build system takes a file whose time or inode has changed as edited, and checkout gives every file a new
      # inode and the current time. Each file gets a time drawn from its content instead, the same from run to run
      # until the file changes.
      - name: Prepare the build cache
        id: xcode
        run: |
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          git ls-files -s | perl -ne '/^\S+ (\S+) \S+\t(.*)$/ and utime 1e9 + hex(substr($1, 0, 7)), 1e9 + hex(substr($1, 0, 7)), $2'
          echo "build=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            build/store
            !build/store/Index.noindex
            !build/store/Logs
          key: store-${{ steps.xcode.outputs.build }}-${{ hashFiles('project.yml', 'Sources/**', 'UnstirTests/**', 'StoreKit/**') }}
          restore-keys: store-${{ steps.xcode.outputs.build }}-
      # Signed ad hoc by the script, so the StoreKit tests run too.
      - name: Build
        env:
          UNSTIR_SIM: ${{ steps.sim.outputs.udid }}
          UNSTIR_ACTION: build-for-testing
        run: scripts/test-store.sh -quiet COMPILER_INDEX_STORE_ENABLE=NO
      - name: Wait for the simulator
        run: xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      - name: Test
        env:
          UNSTIR_SIM: ${{ steps.sim.outputs.udid }}
          UNSTIR_ACTION: test-without-building
        run: scripts/test-store.sh
