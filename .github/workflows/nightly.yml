name: Nightly

# Probe branch only (never merged): times a freshly booted simulator against xcodebuild test-without-building.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    if: github.ref == 'refs/heads/r17-ci-probe'
    strategy:
      fail-fast: false
      matrix:
        variant: [control, spotlight-noboot]
        rep: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Spotlight off
        if: matrix.variant == 'never'
        run: sudo mdutil -a -i off || true
      - name: Install XcodeGen
        run: |
          curl -sSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Prepare the build cache
        run: |
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          git ls-files -s | perl -ne '/^\S+ (\S+) \S+\t(.*)$/ and utime 1e9 + hex(substr($1, 0, 7)), 1e9 + hex(substr($1, 0, 7)), $2'
          git ls-tree -r -d HEAD | perl -ne '/^\S+ \S+ (\S+)\t(.*)$/ and utime 1e9 + hex(substr($1, 0, 7)), 1e9 + hex(substr($1, 0, 7)), $2'
      - uses: actions/cache/restore@v6
        with:
          path: |
            build/store
            !build/store/Index.noindex
            !build/store/Logs
          key: store-17F113-6673e84db203ede7daa0ec6eb1eb425ca618a07ed97f6fd4337771774e292a78
      - name: Build for testing
        shell: bash
        run: scripts/test-store.sh build-for-testing COMPILER_INDEX_STORE_ENABLE=NO -quiet
      - name: Start the sampler
        run: |
          nohup bash -c 'while :; do echo "== $(date +%T) $(sysctl -n vm.loadavg)"; top -l 2 -s 1 -n 5 -o cpu -stats pid,command,cpu | tail -6; sleep 3; done' > "$RUNNER_TEMP/sample.txt" 2>&1 &
      - name: Boot the simulator
        run: |
          udid=$(xcrun simctl list devices available | grep 'iPhone' | grep 'Pro Max (' | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "$udid" > "$RUNNER_TEMP/udid"
          xcrun simctl boot "$udid"
          [[ ${{ matrix.variant }} == spotlight-noboot ]] || xcrun simctl bootstatus "$udid" -b > /dev/null
      - name: Test
        shell: bash
        run: |
          udid=$(cat "$RUNNER_TEMP/udid")
          skip=(-skip-testing:UnstirTests/StoreTests -skip-testing:UnstirTests/FirstStirTests -skip-testing:UnstirTests/SolverTests/testFirstStirParIsTheOptimum -skip-testing:UnstirTests/PackTests/testFirstStirPlaysInOrderFromTheShelf)
          if [[ ${{ matrix.variant }} == spotlight-xctestrun ]]; then
            run=$(find build/store/Build/Products -name '*.xctestrun' | head -1)
            TEST_RUNNER_UNSTIR_STORE_TESTS=1 NSUnbufferedIO=YES xcodebuild test-without-building -xctestrun "$run" -destination "id=$udid" "${skip[@]}" 2>&1 | tee "$RUNNER_TEMP/test.log" | grep --line-buffered -E "^(Test Suite .* (passed|failed)|Test Case .* failed|\*\* TEST|error:|Testing started|Command line)|elapsed"
          else
            NSUnbufferedIO=YES UNSTIR_SIM=$udid scripts/test-store.sh test-without-building "${skip[@]}" 2>&1 | tee "$RUNNER_TEMP/test.log" | grep --line-buffered -E "^(Test Suite .* (passed|failed)|Test Case .* failed|\*\* TEST|error:|Testing started|Command line)|elapsed"
          fi
      - name: Samples
        if: always()
        run: cat "$RUNNER_TEMP/sample.txt"
