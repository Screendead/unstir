name: Nightly

# Probe branch only (never merged): times a freshly booted simulator against xcodebuild test-without-building.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    if: github.ref == 'refs/heads/r17-ci-probe'
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: |
          curl -sSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Prepare the build cache
        run: |
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES
          git ls-files -s | perl -ne '/^\S+ (\S+) \S+\t(.*)$/ and utime 1e9 + hex(substr($1, 0, 7)), 1e9 + hex(substr($1, 0, 7)), $2'
          git ls-tree -r -d HEAD | perl -ne '/^\S+ \S+ (\S+)\t(.*)$/ and utime 1e9 + hex(substr($1, 0, 7)), 1e9 + hex(substr($1, 0, 7)), $2'
          sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string
      - uses: actions/cache/restore@v6
        with:
          path: |
            build/store
            !build/store/Index.noindex
            !build/store/Logs
          key: store-17F113-6673e84db203ede7daa0ec6eb1eb425ca618a07ed97f6fd4337771774e292a78
      - name: Build for testing
        shell: bash
        run: scripts/test-store.sh build-for-testing COMPILER_INDEX_STORE_ENABLE=NO -quiet
      - name: Start the sampler
        run: |
          nohup bash -c 'while :; do echo "== $(date +%T) $(sysctl -n vm.loadavg) $(sysctl -n vm.swapusage)"; vm_stat | grep -E "free|Pageins|Pageouts|Swapouts"; top -l 2 -s 1 -n 6 -o cpu -stats pid,command,cpu,rsize | tail -7; sleep 3; done' > "$RUNNER_TEMP/sample.txt" 2>&1 &
      - name: Boot
        run: |
          udid=$(xcrun simctl list devices available | grep 'iPhone' | grep 'Pro Max (' | head -1 | grep -oE '[0-9A-F-]{36}')
          echo "$udid" > "$RUNNER_TEMP/udid"
          date +%T; xcrun simctl boot "$udid"; date +%T; xcrun simctl bootstatus "$udid" -b; date +%T
      - name: First test-without-building, one small suite
        shell: bash
        run: |
          udid=$(cat "$RUNNER_TEMP/udid")
          date +%T; time xcrun simctl list devices booted; date +%T
          NSUnbufferedIO=YES UNSTIR_SIM=$udid scripts/test-store.sh test-without-building -only-testing:UnstirTests/ClipTests 2>&1 | grep -v '^\s*$'
      - name: Second test-without-building, one small suite
        shell: bash
        run: |
          udid=$(cat "$RUNNER_TEMP/udid")
          NSUnbufferedIO=YES UNSTIR_SIM=$udid scripts/test-store.sh test-without-building -only-testing:UnstirTests/ClipTests 2>&1 | grep -v '^\s*$'
      - name: Third, by xctestrun
        shell: bash
        run: |
          udid=$(cat "$RUNNER_TEMP/udid")
          run=$(ls build/store/Build/Products/*.xctestrun | head -1); echo "$run"
          NSUnbufferedIO=YES TEST_RUNNER_UNSTIR_STORE_TESTS=1 xcodebuild test-without-building -xctestrun "$run" -destination "id=$udid" -only-testing:UnstirTests/ClipTests 2>&1 | grep -v '^\s*$'
      - name: Samples
        if: always()
        run: cat "$RUNNER_TEMP/sample.txt"
