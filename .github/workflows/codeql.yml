name: CodeQL

# No paths-ignore: the master ruleset waits for a CodeQL result on every pull request, so one it skips can't merge.
# The push trigger is master only, which changes only by merges; it gives pull requests a base to compare against.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: codeql-${{ github.head_ref || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, swift]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'swift' && 'manual' || 'none' }}
      # CodeQL's autobuild builds for a device with an Xcode whose Metal toolchain isn't installed; the image's default
      # Xcode builds the simulator app, as the Test workflow does.
      - name: Build
        if: matrix.language == 'swift'
        run: |
          curl -sSL https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --quiet
          xcodebuild build -project Unstir.xcodeproj -scheme Unstir -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
