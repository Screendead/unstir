name: Unstir
options:
  bundleIdPrefix: com.screendead
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 8N575942RT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Unstir:
    type: application
    platform: iOS
    sources:
      - Sources
      # A folder reference keeps Sounds/glass/ in the bundle, where `Sound.use` looks for it.
      - path: Sounds
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Config/Unstir.xcconfig
      Release: Config/Unstir.xcconfig
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UIUserInterfaceStyle: Dark
        AptabaseKey: $(APTABASE_KEY)
        AnalyticsPlaytest: $(ANALYTICS_PLAYTEST)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  UnstirTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - UnstirTests
      - path: StoreKit/Unstir.storekit
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Unstir
schemes:
  Unstir:
    build:
      targets:
        Unstir: all
        UnstirTests: [test]
    run:
      storeKitConfiguration: StoreKit/Unstir.storekit
    test:
      targets: [UnstirTests]
