name: Unstir
options:
  bundleIdPrefix: com.screendead
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 8N575942RT
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Unstir:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: 1
        # Aptabase's app key, which stays out of the repo: scripts/build-ios.sh passes the shell's APTABASE_KEY.
        # Empty leaves analytics off.
        APTABASE_KEY: ""
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        UIUserInterfaceStyle: Dark
        AptabaseKey: $(APTABASE_KEY)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  UnstirTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - UnstirTests
      - path: StoreKit/Unstir.storekit
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Unstir
schemes:
  Unstir:
    build:
      targets:
        Unstir: all
        UnstirTests: [test]
    run:
      storeKitConfiguration: StoreKit/Unstir.storekit
    test:
      targets: [UnstirTests]
